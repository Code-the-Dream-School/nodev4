name: Documentation Issue
description: Report missing, outdated, or unclear documentation
title: "[Docs]: "
labels: ["documentation"]

body:
  - type: textarea
    attributes:
      label: Description
      description: Explain the documentation issue. What part of the docs is affected?
      placeholder: |
        The installation guide does not include steps for setting up
        environment variables required to run the project locally.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Update
      description: Suggest how the documentation should be improved or corrected.
      placeholder: |
        Update the README to include a dedicated section for environment
        configuration, including required variables and example values.

  - type: input
    attributes:
      label: References
      description: Link to the relevant page, section, or resource.
      placeholder: "Example: https://github.com/org/repo/blob/main/README.md#setup"

  - type: textarea
    attributes:
      label: Additional Context
      description: Any other notes or context.
      placeholder: |
        Include screenshots of missing sections, related issues, or
        suggestions for improving clarity and readability.
